# =====================================================================
# Snatzee! — native iOS app
#
# The Xcode project is generated from this file with XcodeGen, so it can
# be reviewed and merged like any other text:
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Snatzee.xcodeproj
#
# Snatzee.xcodeproj itself is not committed.
# =====================================================================
name: Snatzee

options:
  bundleIdPrefix: nl.snatzee
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: B65F8DKJ2N
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"

targets:
  Snatzee:
    type: application
    platform: iOS
    sources:
      - path: Snatzee
        excludes:
          - "Resources/Fonts/README.md"
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Snatzee/Snatzee.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:www.snatzee.nl
          - applinks:snatzee.nl
          - webcredentials:www.snatzee.nl
    info:
      path: Snatzee/Info.plist
      properties:
        CFBundleDisplayName: Snatzee!
        CFBundleDevelopmentRegion: nl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.board-games
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        # The system launch screen: the dice mark on the dark canvas, the
        # same first frame the website paints. SplashView takes over from
        # it with the wordmark and the audio logo.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Mark
          UIImageRespectsSafeAreaInsets: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Snatzee gebruikt de camera om de QR-code van een groep te scannen.
        # Read by AppConfig; set in Config/*.xcconfig.
        SnatzeeAPIScheme: $(SNATZEE_API_SCHEME)
        SnatzeeAPIHost: $(SNATZEE_API_HOST)
        SnatzeeAnonKey: $(SNATZEE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.snatzee.app
        PRODUCT_NAME: Snatzee
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO

  SnatzeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SnatzeeTests
    dependencies:
      - target: Snatzee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.snatzee.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Snatzee:
    build:
      targets:
        Snatzee: all
        SnatzeeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnatzeeTests
    archive:
      config: Release
