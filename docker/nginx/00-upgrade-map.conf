# http-level maps used by default.conf.

# WebSocket / connection upgrade passthrough.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Honour the scheme and host from an upstream TLS terminator (Traefik,
# Caddy, Cloudflare) so the app builds correct absolute URLs; fall back to
# this server's own values when it is the outermost proxy.
map $http_x_forwarded_proto $upstream_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

map $http_x_forwarded_host $upstream_host {
    default $http_host;
    "~."    $http_x_forwarded_host;
}
