# =====================================================================
# Snatzee gateway
#
# Everything is served from one origin on port 6666: the Supabase APIs
# under their standard prefixes, and the Next.js app on everything else.
# Because the browser talks to Supabase on the same origin as the app,
# there are no CORS rules to maintain and no second port to expose.
# =====================================================================

server {
    listen 80;
    # Accepts any host: snatzee.frankvandetechniek.nl, www.snatzee.nl and
    # the bare IP of the Docker host all route here.
    server_name _;

    # Docker's embedded DNS. Upstreams are resolved per request through
    # variables rather than pinned at startup, so recreating a single
    # container does not leave the gateway pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Avatar uploads are capped at 2 MB by the storage bucket; leave room
    # for the multipart envelope.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_proto;
    proxy_set_header X-Forwarded-Host  $upstream_host;
    proxy_read_timeout 120s;

    # --- Supabase Auth (GoTrue) --------------------------------------
    # Note this is /auth/v1/ specifically; the app's own /auth/callback
    # and /auth/signout routes fall through to Next.js below.
    location /auth/v1/ {
        set $auth_upstream http://auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    # --- PostgREST ----------------------------------------------------
    location /rest/v1/ {
        set $rest_upstream http://rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $rest_upstream;
    }

    # --- Storage ------------------------------------------------------
    location /storage/v1/ {
        set $storage_upstream http://storage:5000;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
    }

    # --- The app ------------------------------------------------------
    location / {
        set $app_upstream http://app:3000;
        proxy_pass $app_upstream;
    }
}
