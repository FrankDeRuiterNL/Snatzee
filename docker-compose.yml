# =====================================================================
# Snatzee — full self-hosted stack
#
#   node scripts/generate-keys.mjs >> .env   # secrets
#   cp .env.example .env                     # then fill in the rest
#   docker compose up -d --build
#
# Everything is reachable on http://<docker-host>:6666 — the app and the
# Supabase APIs share one origin, so there is only one port to publish
# and no CORS to configure.
#
# Services:
#   db        PostgreSQL 16 with the Supabase roles
#   auth      Supabase Auth (GoTrue)
#   rest      PostgREST — the /rest/v1 API and RPCs
#   storage   Supabase Storage — avatar uploads
#   migrate   one-shot: applies the Snatzee schema, then exits
#   app       the Next.js application
#   gateway   nginx, the single published entrypoint
# =====================================================================

name: snatzee

x-restart: &restart
  restart: unless-stopped

services:
  db:
    image: postgres:16.15-alpine
    <<: *restart
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, when the volume is empty.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  auth:
    image: supabase/gotrue:v2.197.0
    <<: *restart
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable&search_path=auth

      # Public address of this deployment: OAuth callbacks and the links in
      # confirmation e-mails are built from it.
      API_EXTERNAL_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      # Every origin a user may be redirected back to after sign-in.
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}

      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # Without SMTP configured there is no way to deliver a confirmation
      # link, so accounts are usable immediately. Set this to false once
      # SMTP is filled in below.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: Snatzee

      # Sign in with Google
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback

      # Sign in with Apple
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback

      GOTRUE_LOG_LEVEL: ${LOG_LEVEL:-info}

  rest:
    image: postgrest/postgrest:v12.2.12
    <<: *restart
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      # Publish claims as request.jwt.claims, which is what auth.uid() reads.
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_DB_MAX_ROWS: 1000
      PGRST_LOG_LEVEL: ${LOG_LEVEL:-error}

  storage:
    image: supabase/storage-api:v1.79.2
    <<: *restart
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY in .env}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      DB_INSTALL_ROLES: 'true'
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: snatzee
      REGION: local
      GLOBAL_S3_BUCKET: snatzee
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage

  # One-shot. Waits for GoTrue and storage-api to create their schemas,
  # then applies the Snatzee migrations and exits.
  migrate:
    image: postgres:16.15-alpine
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      storage:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/postgres/supabase-compat.sql:/sql/supabase-compat.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so they are needed
        # here as well as at runtime.
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    image: snatzee:latest
    <<: *restart
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
      # Server-side rendering reaches Supabase over the Docker network
      # rather than going back out through the public hostname.
      SUPABASE_INTERNAL_URL: http://gateway
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  gateway:
    image: nginx:1.29-alpine
    <<: *restart
    depends_on:
      app:
        condition: service_started
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    ports:
      - '${HTTP_PORT:-6666}:80'
    volumes:
      - ./docker/nginx/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
  storage-data:
