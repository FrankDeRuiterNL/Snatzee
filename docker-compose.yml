# =====================================================================
# Snatzee — full self-hosted stack
#
#   cp .env.example .env
#   node scripts/generate-keys.mjs      # paste the secrets into .env
#   docker compose up -d --build
#
# Everything is reachable on http://<docker-host>:6666 — the app and the
# Supabase APIs share one origin, so there is only one port to publish
# and no CORS to configure.
#
# The database, auth, API and storage images and their environment follow
# Supabase's own self-hosting compose file, so this tracks a setup that is
# widely run and tested rather than a hand-rolled equivalent.
#
# Services:
#   db        PostgreSQL with the Supabase roles, schemas and helpers
#   auth      Supabase Auth (GoTrue)
#   rest      PostgREST — the /rest/v1 API and RPCs
#   storage   Supabase Storage — avatar uploads
#   migrate   one-shot: applies the Snatzee schema, then exits
#   app       the Next.js application
#   gateway   nginx, the single published entrypoint
# =====================================================================

name: snatzee

services:
  db:
    # Ships the Supabase roles, the auth/storage schemas, the extensions
    # and auth.uid() — none of which plain postgres has.
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      # Runs once, when the data volume is created. Mounted at both paths
      # because the entrypoint's handling of the init-scripts subdirectory
      # differs between images; db-prepare below is what actually
      # guarantees the passwords are set.
      #- ./docker/postgres/init/01-roles.sql:/docker-entrypoint-initdb.d/init-scripts/01-roles.sql:ro
      - ./docker/postgres/init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot. Sets the service role passwords and hands GoTrue ownership
  # of the auth helper functions, so the services below can actually log
  # in and run their migrations. Idempotent, and it repairs an existing
  # volume rather than requiring one to be thrown away.
  db-prepare:
    image: supabase/postgres:17.6.1.136
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/db-prepare.sh:/db-prepare.sh:ro
    entrypoint: ['/bin/bash', '/db-prepare.sh']

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      # Public address of this deployment: OAuth callbacks and the links in
      # confirmation e-mails are built from it.
      API_EXTERNAL_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_MAILER_EXTERNAL_HOSTS: snatzee.frankvandetechniek.nl
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}
      # Every origin a user may be redirected back to after signing in.
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}

      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # Without SMTP there is no way to deliver a confirmation link, so
      # accounts are usable immediately. Set to false once SMTP is filled in.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: Snatzee

      # Sign in with Google
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback

      # Sign in with Apple
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback

      GOTRUE_LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9999/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      # Publish claims as request.jwt.claims, which is what auth.uid() reads.
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_LOG_LEVEL: ${LOG_LEVEL:-error}
    command: ['postgrest']
    healthcheck:
      test: ['CMD', 'postgrest', '--ready']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY in .env}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${PUBLIC_URL}
      # Storage sits behind the gateway on /storage/v1.
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: snatzee
      TENANT_ID: snatzee
      REGION: local
      # Avatars are served as uploaded; no imgproxy sidecar needed.
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/status']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot. The health checks above guarantee GoTrue and storage-api have
  # finished their own migrations, so the app's foreign keys and storage
  # policies always have something to attach to.
  migrate:
    image: supabase/postgres:17.6.1.136
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/postgres/supabase-compat.sql:/sql/supabase-compat.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/bash', '/migrate.sh']

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so they are needed
        # here as well as at runtime.
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    image: snatzee:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
      # Server-side rendering reaches Supabase over the Docker network
      # rather than going back out through the public hostname.
      SUPABASE_INTERNAL_URL: http://gateway
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    ports:
      - '${HTTP_PORT:-6666}:80'
    volumes:
      - ./docker/nginx/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
  db-config:
  storage-data:
