name: CI

on:
  push:
    branches: [main]
    # The iOS app has its own workflow (ios.yml).
    paths-ignore: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths-ignore: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only needs them to be present.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:6666
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: '1'

  database:
    name: Migrations and permissions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate twice and run the SQL tests
        run: bash scripts/test-db.sh
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          POSTGRES_PASSWORD: postgres
